[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tryagentkey"
version = "0.5.0"
description = "30-second auth & local secrets vault for AI agents. Zero config, local-first."
authors = [{name = "AgentKey, Inc."}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]
classifiers = ["Operating System :: Microsoft :: Windows", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/edan-ais/agentkey"
Repository = "https://github.com/edan-ais/agentkey"

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[project.scripts]
agentkey = "tryagentkey.cli:main"
tryagentkey = "tryagentkey.cli:main"
agentkey-mcp = "tryagentkey.mcp_server:main"
tryagentkey-mcp = "tryagentkey.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["tryagentkey"]

[tool.hatch.build.targets.sdist]
include = ["tryagentkey/", "examples/", "tests/", "README.md", "pyproject.toml", "LICENSE", "NOTICE"]
